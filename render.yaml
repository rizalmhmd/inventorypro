services:
  - type: web
    name: nebulacore
    env: docker
    plan: free
    region: singapore
    docker:
      dockerfilePath: Dockerfile
    startCommand: ./docker/start.sh
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: mongodb
      - key: MONGODB_URI
        value: <set-your-mongodb-connection-string>
      - key: MONGODB_HOST
        value: <your-mongodb-host>
      - key: MONGODB_PORT
        value: "27017"
      - key: MONGODB_DATABASE
        value: inventorypro
      - key: MONGODB_USERNAME
        value: <your-mongodb-username>
      - key: MONGODB_PASSWORD
        value: <your-mongodb-password>